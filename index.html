<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ОТМАЗКИНГ | Генератор оправданий</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap');
        
        :root {
            --bg: #08080a;
            --panel: rgba(20, 20, 25, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: #8b8b9a;
            --accent: #ff2a5f;
            --accent-glow: rgba(255, 42, 95, 0.3);
            --green: #00ff88;
            --green-glow: rgba(0, 255, 136, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 42, 95, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 136, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container {
            width: 100%; max-width: 600px;
            background: var(--panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .header { text-align: center; margin-bottom: 30px; }
        
        h1 {
            font-size: 32px; font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px; text-transform: uppercase;
        }

        .subtitle { color: var(--text-muted); font-size: 13px; font-weight: 600; letter-spacing: 1px; margin-top: 5px; }

        .form-group { margin-bottom: 20px; }
        
        label {
            display: block; font-size: 11px; color: var(--text-muted);
            text-transform: uppercase; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px;
        }

        .input-wrapper { position: relative; }

        select, input[type="text"] {
            width: 100%; padding: 14px 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 12px; color: var(--text); font-size: 15px; font-weight: 600;
            outline: none; transition: all 0.3s ease;
            appearance: none;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--accent);
            background: rgba(255, 42, 95, 0.05);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        select option { background: #151520; color: var(--text); }

        .input-wrapper::after {
            content: '▼'; position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 10px; pointer-events: none;
        }

        .btn-generate {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, var(--accent) 0%, #cc0033 100%);
            color: #fff; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 8px 20px var(--accent-glow);
            margin-top: 10px;
            position: relative; overflow: hidden;
        }

        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 12px 25px var(--accent-glow); }
        .btn-generate:active { transform: translateY(1px); }
        .btn-generate:disabled { background: #222; color: #555; box-shadow: none; cursor: not-allowed; transform: none; }

        .btn-generate::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .btn-generate:hover::before { left: 100%; }

        .result-box {
            margin-top: 25px;
            background: rgba(0, 255, 136, 0.03);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 16px; padding: 20px;
            display: none;
            box-shadow: 0 0 30px var(--green-glow);
        }

        .result-box.show { display: block; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .result-tag { 
            display: inline-block; padding: 4px 10px; border-radius: 20px; 
            font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            background: rgba(255,255,255,0.1); color: var(--text-muted); margin-bottom: 12px;
        }

        .result-text {
            font-size: 17px; line-height: 1.6; color: #fff;
            margin-bottom: 15px; font-weight: 500; font-style: italic;
        }

        .result-actions { display: flex; justify-content: space-between; align-items: center; }

        .btn-copy {
            background: transparent; border: 1px solid var(--green); color: var(--green);
            padding: 8px 16px; border-radius: 8px; font-size: 11px; font-weight: 800;
            cursor: pointer; transition: all 0.2s; text-transform: uppercase;
        }
        .btn-copy:hover { background: var(--green); color: #000; }
        .btn-copy.copied { background: var(--green); color: #000; }

        .btn-again {
            background: transparent; border: none; color: var(--text-muted);
            font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: underline;
        }
        .btn-again:hover { color: var(--text); }

    </style>
</head>
<body>

        </div>

        <button class="btn-generate" id="genBtn" onclick="generate()">Сгенерировать отмазку</button>

        <div class="result-box" id="resultBox">
            <div class="result-tag" id="resultTag">Уровень: Дерзко</div>
            <div class="result-text" id="resultText">Текст отмазки...</div>
            <div class="result-actions">

    function generate() {
        const target = document.getElementById('target').value;
        const reasonInput = document.getElementById('reason').value.trim();
        const level = document.getElementById('level').value;
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');
        const resultTag = document.getElementById('resultTag');
        const btn = document.getElementById('genBtn');

        if (!reasonInput) {
            alert("Напиши, что натворил! (Кратко)");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Анализируем реальность...";
        resultBox.classList.remove('show');

        const levelNames = { "1": "Правдоподобно", "2": "Дерзко", "3": "Абсурдно" };
        resultTag.innerText = "Уровень: " + levelNames[level];

        setTimeout(() => {
            const levelTemplates = templates[target][level];
            const randomTemplate = levelTemplates[Math.floor(Math.random() * levelTemplates.length)];
            
            let finalText = randomTemplate.replace('[ПРИЧИНА]', reasonInput.toLowerCase());

            resultText.innerText = `«${finalText}»`;
            resultBox.classList.add('show');
            
            btn.disabled = false;
            btn.innerText = "Сгенерировать отмазку";

            resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 600); 
    }

    function copyText() {
        const text = document.getElementById('resultText').innerText;
        const btn = document.getElementById('copyBtn');
        
        const cleanText = text.replace(/^«|»$/g, '');

        navigator.clipboard.writeText(cleanText).then(() => {
            btn.innerText = "СКОПИРОВАНО!";
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerText = "Скопировать";
                btn.classList.remove('copied');
            }, 2000);
        });
    }

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ОТМАЗКИНГ PRO | Генератор оправданий</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        :root {
            --bg: #050508;
            --panel: rgba(20, 20, 30, 0.75);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-muted: #8b8b9a;
            --accent: #ff2a5f;
            --accent-hover: #ff4775;
            --accent-glow: rgba(255, 42, 95, 0.4);
            --green: #00ff88;
            --green-glow: rgba(0, 255, 136, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px 15px;
            overflow-x: hidden;
            position: relative;
        }

        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }

        .container {
            width: 100%; max-width: 600px;
            background: var(--panel);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 20px;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .header { text-align: center; margin-bottom: 25px; position: relative; }
        
        h1 {
            font-size: 32px; font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, #ff2a5f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle { color: var(--text-muted); font-size: 12px; font-weight: 600; letter-spacing: 1px; }

        .counter-badge {
            position: absolute; top: -15px; right: 0;
            background: rgba(255, 42, 95, 0.15); border: 1px solid var(--accent);
            color: var(--accent); font-size: 10px; font-weight: 800;
            padding: 4px 10px; border-radius: 20px;
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .form-group { margin-bottom: 18px; }
        
        label {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; color: var(--text-muted);
            text-transform: uppercase; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px;
        }

        .input-wrapper { position: relative; }

        select, input[type="text"] {
            width: 100%; padding: 16px 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 12px; color: var(--text); font-size: 15px; font-weight: 600;
            outline: none; transition: all 0.3s ease;
            appearance: none;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--accent);
            background: rgba(255, 42, 95, 0.05);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        /* Фикс для мобилок: убираем обрезание текста в селекте */
        select {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        select option { background: #151520; color: var(--text); font-weight: 600; }

        .input-wrapper::after {
            content: '▼'; position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 10px; pointer-events: none;
        }

        .random-btn {
            background: transparent; border: none; color: var(--accent);
            font-size: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1px; opacity: 0.8; transition: 0.2s;
        }
        .random-btn:hover { opacity: 1; text-shadow: 0 0 10px var(--accent); }

        .btn-generate {
            width: 100%; padding: 20px;
            background: linear-gradient(135deg, var(--accent) 0%, #cc0033 100%);
            color: #fff; border: none; border-radius: 14px;
            font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 10px 25px var(--accent-glow);
            margin-top: 5px;
            position: relative; overflow: hidden;
        }

        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 15px 35px var(--accent-glow); }
        .btn-generate:active { transform: translateY(2px); box-shadow: 0 5px 15px var(--accent-glow); }
        .btn-generate:disabled { background: #222; color: #555; box-shadow: none; cursor: not-allowed; transform: none; }

        .btn-generate::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .btn-generate:hover::before { left: 100%; }

        .result-box {
            margin-top: 25px;
            background: rgba(0, 255, 136, 0.03);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 16px; padding: 20px;
            display: none;
            position: relative;
            box-shadow: 0 0 40px var(--green-glow);
        }

        .result-box.show { display: block; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .result-tag { 
            display: inline-block; padding: 5px 12px; border-radius: 20px; 
            font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            background: rgba(0, 255, 136, 0.1); color: var(--green); margin-bottom: 12px;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .result-text {
            font-size: 17px; line-height: 1.5; color: #fff;
            margin-bottom: 20px; font-weight: 500;
            font-style: italic;
        }

        .result-actions { display: flex; flex-direction: column; gap: 8px; }

        .action-btn {
            width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px;
            background: transparent; border: 1px solid var(--border); color: var(--text);
            padding: 14px; border-radius: 10px; font-size: 12px; font-weight: 800;
            cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px;
        }

        .btn-copy { border-color: var(--green); color: var(--green); }
        .btn-copy:hover { background: var(--green); color: #000; }
        .btn-copy.copied { background: var(--green); color: #000; }

        .btn-share { border-color: var(--accent); color: var(--accent); }
        .btn-share:hover { background: var(--accent); color: #fff; }

        .btn-again { border-color: var(--text-muted); color: var(--text-muted); }
        .btn-again:hover { background: var(--text-muted); color: #000; }

        .info-section {
            width: 100%; max-width: 600px; text-align: center;
            color: var(--text-muted); font-size: 11px; line-height: 1.5;
            z-index: 10; animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .info-badges {
            display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
        }

        .info-badge {
            display: flex; align-items: center; gap: 4px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            padding: 5px 10px; border-radius: 20px; font-size: 10px; font-weight: 600;
        }
        .info-badge span { color: var(--accent); font-weight: 800; }

        .disclaimer {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            padding: 12px; border-radius: 12px;
        }
        .disclaimer strong { color: var(--text); }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--green); color: #000; padding: 12px 20px;
            border-radius: 10px; font-weight: 800; font-size: 13px;
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
            opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000; text-align: center; width: 90%; max-width: 300px;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        @media (min-width: 480px) {
            .result-actions { flex-direction: row; }
            .action-btn { flex: 1; }
        }
    </style>
</head>
<body>

            </div>
        </div>

        <div class="form-group">
            <label>
                Что случилось?

            </label>
            <input type="text" id="reason" placeholder="Опоздал, пробка, проспал..." value="Проспал будильник">
        </div>

        <div class="form-group">
            <label>Уровень наглости</label>
            <div class="input-wrapper">
                <select id="level">
                    <option value="1">😇 Правдоподобно</option>
                    <option value="2" selected>😈 Дерзко</option>
                    <option value="3">💀 Абсурдно</option>
                </select>
            </div>
        </div>

        <button class="btn-generate" id="genBtn" onclick="generate()">Сгенерировать</button>

        <div class="result-box" id="resultBox">
            <div class="result-tag" id="resultTag">Уровень: Дерзко</div>
            <div class="result-text" id="resultText">Текст отмазки...</div>
            <div class="result-actions">
                <button class="action-btn btn-again" onclick="generate()">🔄 Ещё</button>
                <button class="action-btn btn-share" onclick="shareText()">📤 Поделиться</button>
                <button class="action-btn btn-copy" id="copyBtn" onclick="copyText()">📋 Копировать</button>
            </div>
        </div>
    </div>

    <div class="info-section">
        <div class="info-badges">
            <div class="info-badge">⚡ <span>75+</span> фраз</div>
            <div class="info-badge">🎭 <span>5</span> ситуаций</div>
        </div>
        <div class="disclaimer">
            <strong>ОТМАЗКИНГ</strong> — юмористический инструмент. Не несем ответственности за разрушенные отношения и косые взгляды. 😉
        </div>
    </div>

    <div class="toast" id="toast">Скопировано!</div>

    const randomReasons = [
        "Опоздал на встречу", "Забыл про день рождения", "Не сдал отчет", 
        "Проспал будильник", "Потерял ключи", "Залип в телефоне",
        "Застрял в пробке", "Уронил телефон в унитаз", "Сломался интернет",
        "Кот разбил вазу", "Выпил лишнего", "Не успел купить подарок"
    ];

    let genCount = parseInt(localStorage.getItem('otmazking_count') || '0');
    document.getElementById('counter').innerText = genCount;

    // Умная обработка текста
    function formatReason(text) {
        if (!text) return "непредвиденные обстоятельства";
        // Делаем первую букву строчной, если это не аббревиатура
        let formatted = text.charAt(0).toLowerCase() + text.slice(1);
        // Убираем точку в конце, если есть
        return formatted.replace(/\.$/, '');
    }

    function generate() {
        const target = document.getElementById('target').value;
        const reasonInput = document.getElementById('reason').value.trim();
        const level = document.getElementById('level').value;
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');
        const resultTag = document.getElementById('resultTag');
        const btn = document.getElementById('genBtn');

        if (!reasonInput) {
            showToast("Напиши, что случилось!");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Генерация...";
        resultBox.classList.remove('show');

        const levelNames = { "1": "Правдоподобно", "2": "Дерзко", "3": "Абсурдно" };
        resultTag.innerText = "Уровень: " + levelNames[level];

        setTimeout(() => {
            const levelTemplates = templates[target][level];
            const randomTemplate = levelTemplates[Math.floor(Math.random() * levelTemplates.length)];
            
            // Подставляем очищенную причину
            let finalText = randomTemplate.replace('{Причина}', formatReason(reasonInput));

            // Делаем первую букву заглавной
            finalText = finalText.charAt(0).toUpperCase() + finalText.slice(1);

            resultText.innerText = `«${finalText}»`;
            resultBox.classList.add('show');
            
            btn.disabled = false;
            btn.innerText = "Сгенерировать";

            genCount++;
            localStorage.setItem('otmazking_count', genCount);
            document.getElementById('counter').innerText = genCount;

            resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 400); 
    }

    function randomReason() {
        const input = document.getElementById('reason');
        input.value = randomReasons[Math.floor(Math.random() * randomReasons.length)];
    }

    function copyText() {
        const text = document.getElementById('resultText').innerText;
        const btn = document.getElementById('copyBtn');
        const cleanText = text.replace(/^«|»$/g, '');

        navigator.clipboard.writeText(cleanText).then(() => {
            btn.innerText = "✅ Готово";
            btn.classList.add('copied');
            showToast("Скопировано!");
            setTimeout(() => {
                btn.innerText = "📋 Копировать";
                btn.classList.remove('copied');
            }, 2000);
        });
    }

    function shareText() {
        const text = document.getElementById('resultText').innerText;
        const cleanText = text.replace(/^«|»$/g, '');
        const shareData = {
            title: 'ОТМАЗКИНГ',
            text: `Моя отмазка: ${cleanText}`,
        };

        if (navigator.share) {
            navigator.share(shareData).catch(() => copyText());
        } else {
            copyText();
        }
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Оживленный фон
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];

    function initCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    class Particle {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.size = Math.random() * 2 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.5;
            this.speedY = (Math.random() - 0.5) * 0.5;
            this.opacity = Math.random() * 0.5 + 0.1;
            this.color = Math.random() > 0.8 ? '#ff2a5f' : (Math.random() > 0.5 ? '#00ff88' : '#ffffff');
        }

        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x > width) this.x = 0;
            if (this.x < 0) this.x = width;
            if (this.y > height) this.y = 0;
            if (this.y < 0) this.y = height;
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.globalAlpha = this.opacity;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function createParticles() {
        particles = [];
        const count = Math.floor((width * height) / 15000);
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    let mouse = { x: null, y: null };
    window.addEventListener('mousemove', (e) => {
        mouse.x = e.x;
        mouse.y = e.y;
    });

    function animate() {
        ctx.clearRect(0, 0, width, height);
        if (mouse.x && mouse.y) {
            const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 300);
            gradient.addColorStop(0, 'rgba(255, 42, 95, 0.05)');
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        initCanvas();
        createParticles();
    });

    initCanvas();
    createParticles();
    animate();
</script>
